[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kancelaria-agent"
version = "0.1.0"
description = "Monika – asystentka AI kancelarii (agent mailowy)"
requires-python = ">=3.12"
dependencies = ["claude-agent-sdk", "PyYAML", "python-docx", "pypdf", "openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kancelaria_agent = ["prompts/*.md"]
