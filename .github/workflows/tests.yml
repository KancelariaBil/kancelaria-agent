name: testy
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # poppler (pdftotext) – test PDF pomija się sam, gdy instalacja się nie uda (awaria mirrora apt)
      - run: (sudo apt-get update -q && sudo apt-get install -y -q poppler-utils) || echo "brak poppler-utils"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src python -m pytest -q
